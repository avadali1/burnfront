[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["burnfront/gui/frontend/node_modules"] # TODO: want to include dist but remove everything else, dist needs to be at higher level
#[tool.setuptools]
#packages = ["burnfront", "burnfront.gui", "burnfront.resources", "burnfront.resources.fonts", "burnfront.resources.fonts", "burnfront.resources.propellant_config", "burnfront.resources.validation"]

[project]
name = "burnfront"
version = "0.1.8"

# dynamic = ["version"]
# TODO: option that depends on jax[gpu] for linux
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
	"scipy",
	"dearpygui",
	"dearpygui_ext",
	"scikit-image",
	"coolprop",
	"interpax",
	"opencv-python",
	"matplotlib",
	"cantera",
]

requires-python = ">= 3.10"

authors = [
    {name = "Arushi Vadali"},
    {name = "Drew Nickel"},
    {name = "Thomas A. Scott"},
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"

description = "Burnfront: 3D hybrid rocket motor simulator (a modified version of HRAP)."

[project.optional-dependencies]
# 3D burn simulation: level-set SDF, STL/STEP import
3d = [
    "scikit-fmm",
    "trimesh",
    "rtree",
    "cadquery-ocp",
]
dev = [
    "pytest",
    "rocketcea",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/avadali1/burnfront"
"Original HRAP" = "https://github.com/rnickel1/HRAP_Source"

[project.scripts]
burnfront = "burnfront.gui.app:main"
burnfront-legacy = "burnfront.gui.main:main"
